<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Login - A.S.A.I. Manutenções</title>

</head>
<body>

  <main class="login-container">
    
    <!-- LADO ESQUERDO: FORMULÁRIO DE LOGIN -->
    <section class="login-section">
      <div class="login-box">
        <header>
          <h1>Faça seu login</h1>
        </header>

        <form>
          <div class="input-group">
            <label for="email">E-MAIL</label>
            <input type="email" id="email" required autocomplete="email">
          </div>

          <div class="input-group">
            <label for="senha">SENHA</label>
            <input type="password" id="senha" required>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox"> Lembrar de mim
            </label>
            <a href="#" class="forgot-password">Esqueci minha senha</a>
          </div>

          <button type="submit" class="btn-submit">ENTRAR</button>

          <footer>
            <p>Não tem conta ainda? <a href="#">Crie agora</a></p>
          </footer>
        </form>
      </div>
    </section>

    <!-- LADO DIREITO: IMAGEM DA LOGO -->
    <section class="brand-section">
      <!-- Salve a imagem da logo na mesma pasta e coloque o nome dela aqui (ex: logo.png) -->
      <img src="logo.png" alt="A.S.A.I. Manutenções" class="brand-img">
    </section>

  </main>
