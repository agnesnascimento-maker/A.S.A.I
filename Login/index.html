<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - A.S.A.I. Manutenções</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lado Esquerdo: Formulário -->
  <main>
    <img src="logo.png" alt="Logo A.S.A.I. Manutenções" class="logo">

    <form>
      <div>
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
      </div>

      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>

      <div class="opcoes">
        <label>
          <input type="checkbox" name="lembrar"> Lembrar de mim
        </label>
        <a href="#">Esqueceu sua senha?</a>
      </div>

      <button type="submit">LOGIN</button>
    </form>

    <footer>
      <hr>
      <span>A.S.A.I. MANUTENÇÕES</span>
      <hr>
    </footer>
  </main>

  <!-- Lado Direito: Imagem -->
  <aside>
    <img src="pecas.jpg" alt="Peças Automotivas">
  </aside>

</body>
</html>
